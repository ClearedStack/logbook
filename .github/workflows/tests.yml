name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  saved-examples:
    name: Saved examples on postgres:17-alpine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The same limits Logbook is given in the cluster: an ordinary user, a
      # read-only filesystem, no capabilities, no way to gain privileges and
      # 256 MiB of memory. The tests also need no network. The only writable
      # place is a temporary directory held in that same memory.
      - name: Run every saved example
        run: |
          docker run --rm \
            --user postgres \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m --memory-swap 256m \
            --network none \
            --tmpfs /tmp:rw,exec,nosuid,mode=1777 \
            --volume "$PWD:/logbook:ro" \
            --workdir /logbook \
            postgres:17-alpine sh tests/run.sh

  go-tests:
    name: Go vet, race and Contract v1 replay on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL 17 and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run go vet and go test -race
        env:
          LOGBOOK_REQUIRE_PG17: "1"
          LOGBOOK_REQUIRE_AGE: "1"
        run: |
          go vet ./...
          go test -v -race -count=1 ./...
