# Logbook: one PostgreSQL 17 server with its data on a persistent volume.
#
# The Secret logbook-credentials is not in this repository. It holds two keys,
# postgres-password and muster-password, and is made in the cluster by whoever
# deploys Logbook.
apiVersion: v1
kind: Service
metadata:
  name: logbook
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: logbook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logbook
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logbook
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: logbook
spec:
  serviceName: logbook
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logbook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logbook
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["cm3588-plus"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # postgres in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # postgres:17 (17.12), the image index, so the node picks arm64.
          image: docker.io/library/postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
          env:
            - name: POSTGRES_DB
              value: logbook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logbook-credentials
                  key: postgres-password
            # The same encoding and locale the saved examples run under.
            - name: POSTGRES_INITDB_ARGS
              value: --encoding=UTF8 --locale=C
            # A directory below the mount, so the volume's own lost+found is
            # not in the way of initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-U", "postgres", "-d", "logbook"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
