# Applies the migrations, then lets Muster (and Conn, once pub-ro-password is
# in logbook-credentials) log in.
#
# An Argo CD hook: it runs after each sync, once the database is ready, and the
# Job from the sync before is removed first. migrate.sh applies each migration
# once, so a run with nothing new prints "nothing to apply".
apiVersion: batch/v1
kind: Job
metadata:
  name: logbook-migrate
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: logbook-migrate
    app.kubernetes.io/part-of: clearedstack
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logbook-migrate
        app.kubernetes.io/part-of: clearedstack
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["cm3588-plus"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docker.io/library/postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sh /logbook/bin/migrate.sh
              # Each password is read from the environment by psql itself, so it
              # is never on a command line.
              psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
              \getenv muster_password MUSTER_PASSWORD
              ALTER ROLE muster LOGIN PASSWORD :'muster_password';
              SQL
              echo 'muster may log in'
              if [ -n "${PUB_RO_PASSWORD:-}" ]; then
                psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
              \getenv pub_ro_password PUB_RO_PASSWORD
              ALTER ROLE pub_ro LOGIN PASSWORD :'pub_ro_password';
              SQL
                echo 'pub_ro may log in'
              fi
          env:
            - name: PGHOST
              value: logbook
            - name: PGDATABASE
              value: logbook
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: logbook-credentials
                  key: postgres-password
            - name: MUSTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logbook-credentials
                  key: muster-password
            - name: PUB_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logbook-credentials
                  key: pub-ro-password
                  optional: true
            - name: LOGBOOK_MIGRATIONS
              value: /logbook/migrations
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrate
              mountPath: /logbook/bin
              readOnly: true
            - name: migrations
              mountPath: /logbook/migrations
              readOnly: true
      volumes:
        - name: migrate
          configMap:
            name: logbook-migrate
        - name: migrations
          configMap:
            name: logbook-migrations
