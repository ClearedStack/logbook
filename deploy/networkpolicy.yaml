# Nothing in the namespace may send or receive anything unless a policy says so.
# Every pod in clearedstack is covered, not only Logbook, so each other workload
# here has to bring its own allow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: clearedstack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Who may reach the database: only the migrate Job, Muster and Conn inside
# clearedstack. Workers in cs-workers and outside traffic cannot reach it, and
# Logbook itself may call nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logbook-ingress
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: logbook
    app.kubernetes.io/part-of: clearedstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logbook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logbook-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: muster
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: conn
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
# The migrate Job may look up Logbook's name and connect to it. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logbook-migrate-egress
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: logbook-migrate
    app.kubernetes.io/part-of: clearedstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logbook-migrate
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logbook
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
